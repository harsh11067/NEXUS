[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.25"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
]
fs_permissions = [{ access = "read-write", path = "./" }]

[rpc_endpoints]
galileo = "${OG_RPC_URL}"
og_mainnet = "https://evmrpc.0g.ai"

[etherscan]
galileo = { key = "any", url = "https://chainscan-galileo.0g.ai/open/api", chain = 16602 }
og_mainnet = { key = "any", url = "https://chainscan.0g.ai/open/api", chain = 16661 }
